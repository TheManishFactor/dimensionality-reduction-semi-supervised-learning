project:
  name: dr-semi-supervised-classification
  description: Evaluate how dimensionality reduction affects supervised classifiers
    when trained with limited labelled data and self-training pseudo-labelling.
  random_seed: 42
  verbose: true
data:
  test_size: 0.2
  labelled_proportions:
  - 0.5
  stratify: true
  paths:
    raw_dir: data/raw
    processed_dir: data/processed
  datasets:
    breast_cancer:
      display_name: Breast Cancer Wisconsin (Diagnostic)
      source: 'Kaggle: uciml/breast-cancer-wisconsin-data'
      enabled: false
    mnist:
      display_name: MNIST Digit Recognizer
      source: Kaggle Digit Recognizer competition files in data/raw/mnist/
      enabled: true
    har:
      display_name: Human Activity Recognition Using Smartphones
      source: UCI HAR dataset (Kaggle UCI copy) in data/raw/har/
      enabled: false
  scaling:
    method: standard
    fit_scope: training_partition
  splitting:
    breast_cancer:
      strategy: stratified_holdout
      test_size: 0.2
      stratify: true
    mnist:
      strategy: stratified_holdout
      test_size: 0.2
      stratify: true
      ignore_competition_test: true
    har:
      strategy: official_train_test
      test_size: null
      stratify: false
      preserve_subject_separation: true
dimensionality_reduction:
  methods:
  - none
  - pca
  - lda
  baseline:
    enabled: true
  pca:
    enabled: true
    explained_variance: 0.95
    n_components: 0.95
    whiten: false
    svd_solver: auto
    random_state: 42
  lda:
    enabled: true
    automatic_components: true
    n_components: null
    solver: svd
classifiers:
  logistic_regression:
    C: 1.0
    solver: lbfgs
    max_iter: 2000
    class_weight: null
    random_state: 42
  svm:
    C: 1.0
    loss: squared_hinge
    dual: true
    tol: 0.001
    max_iter: 2000
    class_weight: null
    random_state: 42
  knn:
    n_neighbors: 5
    weights: distance
    metric: minkowski
    p: 2
    algorithm: brute
    n_jobs: -1
self_training:
  confidence_threshold: 0.9
  max_iterations: 10
  minimum_new_pseudo_labels: 1
  random_state: 42
  svm_calibration:
    method: sigmoid
    calibration_fraction: 0.2
    min_per_class: 2
    max_splits: 5
evaluation:
  metrics:
  - accuracy
  - macro_f1
  save_confusion_matrix: false
  n_repeats: 1
results:
  metrics_dir: results/metrics
  figures_dir: results/figures
  reports_dir: results/reports
  classifier_evaluation_dir: results/classifier_evaluation
  self_training_dir: results/self_training/_shard_mnist50
  save_predictions: true
  metrics_filename: experiment_metrics.csv
